
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatiorail"
version = "0.1.0"
description = "A spatial-native workflow orchestration framework for geospatial processing, distributed workers, data validation, versioning, and production releases."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "SpatioRail Contributors" }
]
keywords = [
    "gis",
    "geospatial",
    "spatial",
    "workflow",
    "orchestration",
    "pipeline",
    "geodata"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS"
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit"
]

spatial = [
    "GDAL",
    "shapely",
    "pyproj"
]

[tool.hatch.build.targets.wheel]
packages = ["src/spatiorail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
